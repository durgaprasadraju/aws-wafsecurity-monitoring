# =============================================================================
# WAF Security Platform — GitHub Actions CI/CD Pipeline
# =============================================================================
# Triggers on pushes to main/develop and on pull requests targeting main.
# Validates Terraform, scans for security issues, runs tests, and (on main only)
# produces a Terraform plan artifact using OIDC-based AWS credentials.
# =============================================================================

name: WAF Security Platform CI/CD

on:
  push:
    branches: [main, develop]   # Run full pipeline on direct pushes to these branches
  pull_request:
    branches: [main]            # Run validation/tests on PRs into main (no deploy plan)

# Shared environment variables available to all jobs
env:
  AWS_REGION: us-west-2         # Must match terraform/environments/*/terraform.tfvars
  TF_VERSION: "1.7.5"           # Pin Terraform CLI version for reproducible plans

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Terraform format check + module/environment validation
  # Runs on every push and PR — fast feedback before security scans or tests.
  # ---------------------------------------------------------------------------
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install the same Terraform version used in production deploys
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Fail if any .tf file is not terraform fmt-compliant
      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      # Init (no backend) + validate every module and the dev environment
      - name: Validate Modules
        run: bash tests/terraform/validate.sh dev

  # ---------------------------------------------------------------------------
  # Job 2: Static security analysis — Terraform + Python Lambda code
  # Runs in parallel with terraform-validate; does not block unit tests.
  # ---------------------------------------------------------------------------
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tfsec: Terraform-specific misconfiguration scanner (IAM, encryption, etc.)
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform

      # Checkov: Broader IaC policy checks (CIS, AWS best practices)
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          quiet: true                    # Suppress verbose output; still fails on findings

      # bandit + semgrep: Python security linting for lambda/report_generator
      # "|| true" keeps the job green for informational findings in sandbox builds
      - name: Python Security Scan
        run: |
          pip install bandit semgrep
          bandit -r lambda/ -ll -q || true
          semgrep --config auto lambda/ --error --quiet || true

  # ---------------------------------------------------------------------------
  # Job 3: Python unit tests with coverage report
  # Tests Lambda handler logic, helpers, and shared utilities.
  # ---------------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"         # Matches Lambda runtime in terraform/modules/lambda

      # Install project + dev dependencies (pytest, coverage, etc.)
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/unit/ --cov=lambda --cov-report=term-missing

  # ---------------------------------------------------------------------------
  # Job 4: Integration-style validation (PRs only)
  # Validates Grafana dashboard JSON schema and Prometheus/Alertmanager configs.
  # Waits for terraform-validate and unit-tests to pass first.
  # ---------------------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    needs: [terraform-validate, unit-tests]
    if: github.event_name == 'pull_request'   # Skip on direct pushes to main/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ensures dashboards/grafana/*.json are valid and reference expected datasources
      - name: Dashboard validation
        run: pytest tests/unit/test_dashboard_validation.py -v

      # Ensures observability/prometheus/*.yml and alertmanager configs parse correctly
      - name: Prometheus config validation
        run: pytest tests/unit/test_prometheus_alertmanager.py -v

  # ---------------------------------------------------------------------------
  # Job 5: Terraform plan against AWS (main branch pushes only)
  # Uses GitHub OIDC → IAM role assumption (no long-lived AWS keys in secrets).
  # Uploads the binary plan file as a CI artifact for optional manual review/apply.
  # NOTE: This job plans only; it does NOT run terraform apply automatically.
  # ---------------------------------------------------------------------------
  terraform-plan:
    runs-on: ubuntu-latest
    needs: [terraform-validate, security-scan]
    if: github.ref == 'refs/heads/main'       # Plan only when code lands on main
    permissions:
      id-token: write                          # Required for aws-actions/configure-aws-credentials OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Assume IAM role via GitHub OIDC — set AWS_ROLE_ARN in repo secrets
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Init remote backend (S3 + DynamoDB) and produce a saved plan file
      - name: Terraform Plan
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan

      # Store tfplan for download from the Actions run (review before apply)
      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/environments/dev/tfplan
