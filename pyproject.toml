[project]
name = "waf-security-platform"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.21.0",
]

[project.optional-dependencies]
loadtest = ["locust>=2.24.0"]
dev = ["bandit>=1.7.0", "semgrep>=1.60.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lambda/report_generator"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["lambda/report_generator", "scripts", "tests"]
omit = ["*/tests/*", "*/.build/*"]
