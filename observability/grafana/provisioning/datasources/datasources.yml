apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false

  - name: CloudWatch
    type: cloudwatch
    access: proxy
    jsonData:
      authType: default
      defaultRegion: us-west-2

  - name: Athena
    type: grafana-athena-datasource
    access: proxy
    jsonData:
      authType: default
      defaultRegion: us-west-2
      catalog: AwsDataCatalog
      database: waf_security_dev_waf
      workgroup: waf-security-dev-waf-analytics
      outputLocation: s3://waf-security-dev-waf-logs-ACCOUNT_ID/athena-results/
