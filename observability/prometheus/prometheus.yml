global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: '${ENVIRONMENT}'
    project: 'waf-security-platform'

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - '${AGENT_NODE_1}:9100'
          - '${AGENT_NODE_2}:9100'
          - '${AGENT_NODE_3}:9100'
        labels:
          tier: agent

  - job_name: node-exporter-monitoring
    static_configs:
      - targets:
          - localhost:9100
        labels:
          tier: monitoring

  - job_name: cloudwatch-exporter
    static_configs:
      - targets:
          - localhost:9106
    metrics_path: /metrics

  - job_name: blackbox-exporter
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - '${ALB_DNS_NAME}'
        labels:
          service: alb
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115

  - job_name: aws-waf-cloudwatch
    static_configs:
      - targets:
          - localhost:9106
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'aws_wafv2_.*'
        action: keep

  - job_name: aws-lambda-cloudwatch
    static_configs:
      - targets:
          - localhost:9106
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'aws_lambda_.*'
        action: keep

  - job_name: aws-firehose-cloudwatch
    static_configs:
      - targets:
          - localhost:9106
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'aws_firehose_.*'
        action: keep

  - job_name: aws-athena-cloudwatch
    static_configs:
      - targets:
          - localhost:9106
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'aws_athena_.*'
        action: keep

storage:
  tsdb:
    retention.time: 30d
    path: /var/lib/prometheus/data
