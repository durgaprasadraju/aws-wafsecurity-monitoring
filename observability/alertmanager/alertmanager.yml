global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${ALERT_EMAIL_FROM}'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'

route:
  receiver: default
  group_by: ['alertname', 'severity', 'team']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: critical-alerts
      continue: true
    - match:
        severity: high
      receiver: high-alerts
    - match:
        severity: medium
      receiver: medium-alerts
    - match:
        severity: low
      receiver: low-alerts

receivers:
  - name: default
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true

  - name: critical-alerts
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#security-critical'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    sns_configs:
      - sigv4:
          region: '${AWS_REGION}'
        topic_arn: '${SNS_TOPIC_ARN}'
        subject: 'CRITICAL: {{ .GroupLabels.alertname }}'

  - name: high-alerts
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#security-alerts'
        send_resolved: true

  - name: medium-alerts
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true

  - name: low-alerts
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: high
    equal: ['alertname', 'instance']
